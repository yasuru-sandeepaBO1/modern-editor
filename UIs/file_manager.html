<!DOCTYPE html>

<html class="dark" lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Code Editor Modal Variants</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-fixed-dim": "#bdc7db",
                        "secondary-fixed": "#d9e3f8",
                        "on-surface": "#dee2ed",
                        "on-secondary-container": "#abb6c9",
                        "inverse-primary": "#44617d",
                        "primary": "#accaea",
                        "on-tertiary-fixed": "#161c28",
                        "surface-container-lowest": "#090e15",
                        "on-primary": "#13334c",
                        "surface-container-highest": "#30353d",
                        "on-tertiary": "#2a303e",
                        "secondary": "#bdc7db",
                        "surface": "#0f141b",
                        "on-tertiary-container": "#242a37",
                        "on-secondary-fixed-variant": "#3d4758",
                        "surface-container": "#1b2027",
                        "tertiary": "#c1c6d7",
                        "background": "#0f141b",
                        "on-primary-fixed": "#001d33",
                        "on-secondary": "#273140",
                        "on-error": "#690005",
                        "error": "#ffb4ab",
                        "on-primary-fixed-variant": "#2c4964",
                        "inverse-surface": "#dee2ed",
                        "surface-dim": "#0f141b",
                        "tertiary-container": "#8b91a1",
                        "on-background": "#dee2ed",
                        "on-secondary-fixed": "#121c2b",
                        "primary-fixed-dim": "#accaea",
                        "inverse-on-surface": "#2c3138",
                        "on-primary-container": "#0a2c45",
                        "tertiary-fixed": "#dde2f4",
                        "surface-bright": "#343941",
                        "surface-tint": "#accaea",
                        "outline-variant": "#43474d",
                        "surface-container-low": "#171c23",
                        "error-container": "#93000a",
                        "primary-fixed": "#cee5ff",
                        "outline": "#8d9198",
                        "surface-container-high": "#252a32",
                        "on-error-container": "#ffdad6",
                        "primary-container": "#7794b2",
                        "on-tertiary-fixed-variant": "#414755",
                        "tertiary-fixed-dim": "#c1c6d7",
                        "on-surface-variant": "#c3c7ce",
                        "secondary-container": "#3d4758",
                        "surface-variant": "#30353d",
                        "accent": "#7F52FF"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem",
                        "2xl": "1rem"
                    },
                    spacing: {
                        "unit": "4px",
                        "menu-item-height": "44px",
                        "toolbar-height": "48px",
                        "keyboard-accessory-height": "40px",
                        "gutter-editor": "16px",
                        "tab-height": "36px"
                    },
                    fontFamily: {
                        "code-sm": ["JetBrains Mono", "monospace"],
                        "headline-sm": ["Hanken Grotesk", "sans-serif"],
                        "code-md": ["JetBrains Mono", "monospace"],
                        "label-xs": ["JetBrains Mono", "monospace"],
                        "body-md": ["Hanken Grotesk", "sans-serif"],
                        "body-sm": ["Hanken Grotesk", "sans-serif"],
                        "title": ["Hanken Grotesk", "sans-serif"]
                    },
                    fontSize: {
                        "code-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "code-md": ["14px", { "lineHeight": "21px", "fontWeight": "400" }],
                        "label-xs": ["10px", { "lineHeight": "12px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000;
        }
        .scrim {
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }
        .modal-card {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--outline-variant, #43474d);
        }
        .input-field {
            background-color: #0f141b;
            border: 1px solid var(--outline-variant, #43474d);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-field:focus-within {
            border-color: #7F52FF;
            box-shadow: 0 0 0 1px #7F52FF;
        }
        .btn-primary {
            background-color: #7F52FF;
            color: white;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #6d42e5;
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col items-center py-12 px-4 space-y-8 overflow-y-auto">
<!-- Background Scrim (Simulated) -->
<div class="fixed inset-0 scrim z-0 pointer-events-none"></div>
<!-- Variant 1: New File -->
<div class="modal-card bg-surface-container-low w-full max-w-sm rounded-2xl p-6 z-10 relative flex flex-col gap-6">
    <h2 class="font-headline-sm text-headline-sm text-on-surface m-0 p-0">New File</h2>
    <div class="flex flex-col gap-4">
        <div class="input-field rounded flex items-center px-3 h-10">
            <input class="bg-transparent border-none outline-none text-on-surface font-code-md text-code-md flex-1 w-full placeholder:text-on-surface-variant/40" placeholder="filename" type="text"/>
        </div>
        <div class="flex gap-2">
            <button class="flex-1 bg-surface-variant border border-outline-variant rounded px-3 py-2 text-center">
                <span class="font-code-sm text-code-sm text-on-surface block">.kt</span>
                <span class="font-label-xs text-label-xs text-on-surface-variant block mt-1">Kotlin</span>
            </button>
            <button class="flex-1 bg-transparent border border-outline-variant rounded px-3 py-2 text-center opacity-60 hover:opacity-100 transition-opacity">
                <span class="font-code-sm text-code-sm text-on-surface block">.md</span>
                <span class="font-label-xs text-label-xs text-on-surface-variant block mt-1">Markdown</span>
            </button>
            <button class="flex-1 bg-transparent border border-outline-variant rounded px-3 py-2 text-center opacity-60 hover:opacity-100 transition-opacity">
                <span class="font-code-sm text-code-sm text-on-surface block">.txt</span>
                <span class="font-label-xs text-label-xs text-on-surface-variant block mt-1">Text</span>
            </button>
        </div>
    </div>
    <div class="flex justify-end gap-3 mt-2">
        <button class="font-body-md text-body-md text-on-surface-variant hover:text-on-surface px-4 py-2 rounded transition-colors">Cancel</button>
        <button class="btn-primary font-body-md text-body-md px-4 py-2 rounded">Create</button>
    </div>
</div>
<!-- Variant 2: Save As -->
<div class="modal-card bg-surface-container-low w-full max-w-sm rounded-2xl p-6 z-10 relative flex flex-col gap-6">
    <h2 class="font-headline-sm text-headline-sm text-on-surface m-0 p-0">Save As</h2>
    <div class="input-field rounded flex items-center px-3 h-10">
        <input class="bg-transparent border-none outline-none text-on-surface font-code-md text-code-md flex-1 w-full" type="text" value="Main.kt"/>
    </div>
    <div class="flex justify-end gap-3 mt-2">
        <button class="font-body-md text-body-md text-on-surface-variant hover:text-on-surface px-4 py-2 rounded transition-colors">Cancel</button>
        <button class="btn-primary font-body-md text-body-md px-4 py-2 rounded">Save</button>
    </div>
</div>
<!-- Variant 3: Rename File -->
<div class="modal-card bg-surface-container-low w-full max-w-sm rounded-2xl p-6 z-10 relative flex flex-col gap-6">
    <h2 class="font-headline-sm text-headline-sm text-on-surface m-0 p-0">Rename File</h2>
    <div class="input-field rounded flex items-center px-3 h-10">
        <input class="bg-transparent border-none outline-none text-on-surface font-code-md text-code-md flex-1 w-full" type="text" value="OldName.kt"/>
    </div>
    <div class="flex justify-end gap-3 mt-2">
        <button class="font-body-md text-body-md text-on-surface-variant hover:text-on-surface px-4 py-2 rounded transition-colors">Cancel</button>
        <button class="btn-primary font-body-md text-body-md px-4 py-2 rounded">Rename</button>
    </div>
</div>
</body></html>
