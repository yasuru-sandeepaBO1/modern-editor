<!DOCTYPE html><html lang="en" style=""><head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Mobile Code Editor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                app: {
                  bg: '#31323f', // status bar top area bg
                  header: '#353b47',
                  editorBg: '#1e2430',
                  gutterBg: '#1e2430',
                  gutterText: '#4c556b',
                  tabBg: '#272b36',
                  tabActive: '#1e2430',
                  toolbarBg: '#353b47',
                  btnBg: '#475163',
                  btnText: '#c4c8d1'
                }
              },
              fontFamily: {
                mono: ['"Fira Code"', '"Roboto Mono"', 'monospace'],
                sans: ['"Roboto"', 'sans-serif']
              }
            }
          }
        }
    </script>
    <style data-purpose="custom-styles" type="text/tailwindcss">
        @layer utilities {
          .icon-sm {
            @apply text-[20px] leading-none;
          }
          .icon-md {
            @apply text-[24px] leading-none;
          }
        }
    </style>
</head>
<body class="bg-app-editorBg text-gray-300 h-screen w-screen flex flex-col font-sans overflow-hidden antialiased">
<!-- BEGIN: Top Status Bar Area (OS level simulator) -->
<div class="h-8 bg-[#494a5c] w-full flex items-center justify-between px-4 text-xs font-medium text-white shadow-sm z-50">
    <div class="">5:59 <span class="material-icons-outlined text-[14px] align-middle ml-1">chat</span></div>
    <div class="flex items-center space-x-2">
        <span class="material-icons-outlined text-[14px]">remove_circle_outline</span>
        <span class="">LTE</span>
        <span class="material-icons text-[14px]">signal_cellular_4_bar</span>
        <div class="flex items-center bg-yellow-500/20 px-1.5 py-0.5 rounded text-[10px]">
            22+
        </div>
    </div>
</div>
<!-- END: Top Status Bar Area -->
<!-- BEGIN: Header & Tabs -->
<header class="bg-app-header border-b border-gray-700 flex flex-col pt-1">
    <!-- Folder & Tab row -->
    <div class="flex items-center px-3 gap-2">
        <button class="p-1 text-gray-400 hover:text-white">
            <span class="material-icons icon-md">menu</span>
        </button>
        <!-- Active Tab -->
        <div class="bg-app-editorBg text-gray-200 px-3 py-1.5 rounded-t-lg flex items-center gap-2 text-sm border-t border-l border-r border-gray-700 translate-y-px">
            <span class="material-icons-outlined icon-sm text-gray-400 text-[16px]">description</span>
            <span class="">untitled.txt</span>
            <button class="hover:text-white ml-2">
                <span class="material-icons-outlined icon-sm text-[16px]">close</span>
            </button>
        </div>
    </div>
    <!-- Toolbar row -->
    <div class="flex items-center justify-between px-2 py-2 bg-app-header border-b border-gray-700 shadow-sm relative z-10">
        <div class="flex items-center gap-3">
            <button class="p-1 text-gray-300 hover:text-white">
                <span class="material-icons icon-md">arrow_back</span>
            </button>
            <span class="text-gray-400 text-sm">New file</span>
        </div>
        <div class="flex items-center gap-1">
            <button class="p-1.5 text-gray-300 hover:text-white rounded flex items-center justify-center">
                <span class="material-icons-outlined icon-md">undo</span>
            </button>
            <button class="p-1.5 text-gray-300 hover:text-white rounded flex items-center justify-center">
                <span class="material-icons-outlined icon-md">redo</span>
            </button><button class="p-1.5 text-gray-300 hover:text-white rounded">
            <span class="material-icons-outlined icon-md">search</span>
        </button>
            <button class="p-1.5 text-gray-300 hover:text-white rounded">
                <span class="material-icons-outlined icon-md">save</span>
            </button>
            <button class="p-1.5 text-gray-300 hover:text-white rounded">
                <span class="material-icons icon-md">more_horiz</span>
            </button>
        </div>
    </div>
</header>
<!-- END: Header & Tabs -->
<!-- BEGIN: Main Editor Area -->
<main class="flex-1 flex overflow-hidden relative">
    <!-- Line Numbers Gutter -->
    <div class="w-10 bg-app-gutterBg border-r border-gray-800 flex flex-col items-end py-1 px-1 font-mono text-xs text-app-gutterText">
        <span class="">1</span>
    </div>
    <!-- Code Input Area -->
    <div class="flex-1 p-2 font-mono text-sm overflow-auto outline-none cursor-text whitespace-pre"></div>
    <!-- Scroll Handle -->
    <div class="absolute right-0 top-1/2 -translate-y-1/2 p-1">
        <div class="bg-white/80 rounded-l-md p-1 shadow-md">
        </div>
    </div>
</main>
<!-- END: Main Editor Area -->
<!-- BEGIN: Bottom Accessory Toolbar -->
<div class="bg-app-editorBg border-t border-gray-800 px-3 py-1 flex items-center justify-between text-[10px] font-mono text-gray-500">
    <div class="flex items-center gap-3">
        <span class="">Line 10, Col 5</span>
    </div>
    <div class="flex items-center gap-3">
        <span class="">UTF-8</span>

    </div>
</div><div class="bg-app-toolbarBg p-2 flex flex-col gap-2 border-t border-gray-700 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
    <!-- Row 1 -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar scroll-smooth">
        <!-- Drag handle area indicator -->
        <div class="flex flex-col gap-[2px] px-1 text-gray-500 justify-center">
            <div class="w-1 h-1 bg-gray-500 rounded-full"></div>
            <div class="w-1 h-1 bg-gray-500 rounded-full"></div>
            <div class="w-1 h-1 bg-gray-500 rounded-full"></div>
        </div>
        <button class="bg-app-btnBg text-app-btnText px-3 py-1.5 rounded text-sm font-mono whitespace-nowrap">class</button>
        <button class="bg-app-btnBg text-app-btnText px-3 py-1.5 rounded text-sm font-mono whitespace-nowrap">id</button>
        <button class="bg-app-btnBg text-app-btnText px-3 py-1.5 rounded text-sm font-mono whitespace-nowrap">?:</button>
        <button class="bg-app-btnBg text-app-btnText px-3 py-1.5 rounded text-sm font-mono whitespace-nowrap">[class]</button>
        <button class="bg-app-btnBg text-app-btnText px-3 py-1.5 rounded text-sm font-mono whitespace-nowrap">[id]</button>
        <button class="bg-app-btnBg text-app-btnText px-3 py-1.5 rounded text-sm font-mono whitespace-nowrap">html:snippet</button>
    </div>
    <!-- Row 2 -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar scroll-smooth pl-3">
        <button class="bg-app-btnBg text-app-btnText px-3 py-1.5 rounded text-sm font-mono whitespace-nowrap">-&gt;</button>
        <button class="bg-app-btnBg text-app-btnText px-3 py-1.5 rounded text-sm font-mono whitespace-nowrap">=" "</button>
        <button class="bg-app-btnBg text-app-btnText px-3 py-1.5 rounded text-sm font-mono whitespace-nowrap">&lt;</button>
        <button class="bg-app-btnBg text-app-btnText px-3 py-1.5 rounded text-sm font-mono whitespace-nowrap">&gt;</button>
        <button class="bg-app-btnBg text-app-btnText px-3 py-1.5 rounded text-sm font-mono whitespace-nowrap">&lt;/</button>
        <button class="bg-app-btnBg text-app-btnText px-3 py-1.5 rounded text-sm font-mono whitespace-nowrap">-</button>
        <button class="bg-app-btnBg text-app-btnText px-3 py-1.5 rounded text-sm font-mono whitespace-nowrap">#</button>
    </div>
</div>
<!-- END: Bottom Accessory Toolbar -->
<!-- BEGIN: Home Indicator (OS level) -->
<div class="bg-app-toolbarBg pb-2 pt-1 flex justify-center w-full">
    <div class="w-1/3 h-1 bg-gray-400 rounded-full"></div>
</div>
<!-- END: Home Indicator -->
<style data-purpose="scrollbar-hide">
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
</style>


</body></html>
